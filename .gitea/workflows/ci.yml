name: dbt to Wikijs docs CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches: [ master ]

env:
  UV_CACHE_DIR: ~/.cache/uv

jobs:

  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ vars.KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          echo "Host ssh.andreaconsonni.dev" >> ~/.ssh/config
          echo "  HostName gitea" >> ~/.ssh/config
          echo "  Port 2222" >> ~/.ssh/config
          echo "  StrictHostKeyChecking yes" >> ~/.ssh/config

      - name: Clone repository
        run: |
          git clone ssh://git@ssh.andreaconsonni.dev:2222/acc/dbt-to-wikijs-docs.git .
          git checkout --detach "${GITHUB_SHA}"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Cache uv
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: |
          set +e
          uv run pytest
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then
            echo "No tests collected; continuing CI."
            exit 0
          fi
          exit "$rc"
